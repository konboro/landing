# Supabase CLI config.
#
# Edge functions live in services/edge/functions/ (the monorepo layout, see
# CLAUDE.md), not the CLI default supabase/functions/. Per-function
# `entrypoint` points the CLI at the real files so nothing has to be moved or
# symlinked, and relative `../../_shared/*` imports keep resolving.

project_id = "pyferakmgtafifffqjat"

[functions.admin-charge]
entrypoint = "../services/edge/functions/admin-charge/index.ts"

